openapi: 3.0.0
info:
  title: LiteStock System - Found Items Integration API
  version: 1.0.0
  description: API provided by Team 10 and consumed by Team 11 (LiteStock) to query found items, inspect locations and images, and log newly found items.
paths:
  /found-items:
    get:
      summary: Retrieve a filtered or full list of found items
      description: Returns a list of found items. Supports optional search and category filters. Returns an empty array `[]` when no items match.
      parameters:
        - name: search
          in: query
          required: false
          description: Search term matching title or description.
          schema:
            type: string
            example: "water bottle"
        - name: category
          in: query
          required: false
          description: Category filter for found items.
          schema:
            type: string
            example: "electronics"
      responses:
        '200':
          description: List of found items retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoundItem'
        '400':
          description: Invalid request parameter format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Record a newly found item
      description: Log a new found item into the system including details, location, and optional image links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - category
                - location
                - dateFound
              properties:
                title:
                  type: string
                  example: "Hydro Flask Water Bottle"
                category:
                  type: string
                  example: "personal items"
                description:
                  type: string
                  example: "Blue 32oz Hydro Flask with a hydro sticker"
                location:
                  type: string
                  example: "Library 2nd Floor Study Desk"
                dateFound:
                  type: string
                  format: date-time
                  example: "2026-09-01T14:30:00Z"
                images:
                  type: array
                  items:
                    type: string
                    format: uri
                  example:
                    - "https://storage.university.edu/found/img1029.jpg"
      responses:
        '201':
          description: Found item created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundItem'
        '400':
          description: Missing or invalid required payload fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /found-items/{id}:
    get:
      summary: Retrieve specific found item details
      description: Returns detailed metadata for a single item by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique integer ID of the found item.
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: Found item details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundItem'
        '404':
          description: Found item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /found-items/{id}/images:
    get:
      summary: Retrieve images associated with a specific found item
      description: Returns image URLs linked to the requested found item.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique integer ID of the found item.
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: List of image URLs retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - itemId
                  - images
                properties:
                  itemId:
                    type: integer
                    example: 101
                  images:
                    type: array
                    items:
                      type: string
                      format: uri
                    example:
                      - "https://storage.university.edu/found/img1029.jpg"
                      - "https://storage.university.edu/found/img1030.jpg"
        '404':
          description: Found item or images not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /found-items/{id}/location:
    get:
      summary: Retrieve physical retrieval location for a specific item
      description: Returns detailed physical location and security office details to retrieve the item.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique integer ID of the found item.
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: Location info retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - itemId
                  - storageLocation
                  - pickupOffice
                properties:
                  itemId:
                    type: integer
                    example: 101
                  storageLocation:
                    type: string
                    example: "Locker B-12, Main Campus Security Center"
                  pickupOffice:
                    type: string
                    example: "Central Security Desk - Hall A"
                  pickupHours:
                    type: string
                    example: "Mon-Fri 08:00-17:00"
        '404':
          description: Found item or location record not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FoundItem:
      type: object
      required:
        - id
        - title
        - category
        - location
        - dateFound
        - status
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: "Hydro Flask Water Bottle"
        category:
          type: string
          example: "personal items"
        description:
          type: string
          example: "Blue 32oz Hydro Flask with a hydro sticker"
        location:
          type: string
          example: "Library 2nd Floor Study Desk"
        dateFound:
          type: string
          format: date-time
          example: "2026-09-01T14:30:00Z"
        status:
          type: string
          enum: [unclaimed, under_review, claimed, closed]
          example: "unclaimed"
        images:
          type: array
          items:
            type: string
            format: uri
          example:
            - "https://storage.university.edu/found/img1029.jpg"

    ErrorResponse:
      type: object
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: "Resource not found."