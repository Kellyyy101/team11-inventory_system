openapi: 3.0.0
info:
  title: LiteStock Inventory API for QuickFundi
  version: 2.0.0
  description: Read-only API for QuickFundi to retrieve product, stock, and sales data from LiteStock's inventory_db.

servers:
  - url: /
    description: Same host serving this API

tags:
  - name: Products
    description: LiteStock product catalogue
  - name: Inventory
    description: Current product stock
  - name: Sales
    description: LiteStock sales activity

paths:
  /api/products:
    get:
      tags: [Products]
      summary: List products
      description: Returns LiteStock products and their current prices and stock quantities. Search matches product names; category matches the stored category.
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive substring to match against product names.
          schema:
            type: string
            minLength: 1
          example: flour
        - name: category
          in: query
          required: false
          description: Exact product category to match.
          schema:
            type: string
            minLength: 1
          example: Grains
      responses:
        '200':
          description: Product list retrieved successfully. An empty products array means no products matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
              example:
                count: 1
                products:
                  - id: 12
                    name: Maize Flour 2kg
                    category: Grains
                    price: 180.00
                    stock_quantity: 25
        '400':
          description: Invalid search or category filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected database or server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/products/{product_id}:
    get:
      tags: [Products]
      summary: Get a product
      description: Returns a single LiteStock product by its products.id value.
      parameters:
        - name: product_id
          in: path
          required: true
          description: Positive integer product ID from LiteStock.
          schema:
            type: integer
            minimum: 1
          example: 12
      responses:
        '200':
          description: Product found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 12
                name: Maize Flour 2kg
                category: Grains
                price: 180.00
                stock_quantity: 25
        '400':
          description: Product ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No product has this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected database or server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/inventory:
    get:
      tags: [Inventory]
      summary: Get current inventory
      description: Returns stock quantities from products.stock_quantity. Low stock means fewer than 10 units, matching LiteStock's dashboard threshold.
      parameters:
        - name: low_stock
          in: query
          required: false
          description: When true, return only products with fewer than 10 units. When false or omitted, return all products.
          schema:
            type: boolean
          example: true
      responses:
        '200':
          description: Inventory retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
              example:
                count: 2
                inventory:
                  - product_id: 12
                    name: Maize Flour 2kg
                    category: Grains
                    stock_quantity: 25
                    status: in_stock
                  - product_id: 18
                    name: Tea Leaves
                    category: Beverages
                    stock_quantity: 0
                    status: out_of_stock
        '400':
          description: The low_stock filter is not a valid boolean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected database or server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sales:
    get:
      tags: [Sales]
      summary: List sales
      description: Returns LiteStock sales, optionally filtered by an inclusive date range. Responses intentionally omit cashier and user identifiers.
      parameters:
        - name: from
          in: query
          required: false
          description: Include sales on or after this date. Must be used with a YYYY-MM-DD date.
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: false
          description: Include sales on or before this date. Must be used with a YYYY-MM-DD date.
          schema:
            type: string
            format: date
          example: '2026-10-28'
      responses:
        '200':
          description: Sales retrieved successfully. An empty sales array means no sales matched the requested period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesResponse'
              example:
                count: 1
                sales:
                  - id: 501
                    product_id: 12
                    product_name: Maize Flour 2kg
                    sale_date: '2026-10-28T11:24:00Z'
                    quantity_sold: 2
                    total_price: 360.00
        '400':
          description: Invalid date or from is later than to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected database or server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - category
        - price
        - stock_quantity
      properties:
        id:
          type: integer
          description: LiteStock products.id.
          example: 12
        name:
          type: string
          example: Maize Flour 2kg
        category:
          type: string
          nullable: true
          example: Grains
        price:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          example: 180.00
        stock_quantity:
          type: integer
          minimum: 0
          example: 25

    ProductsResponse:
      type: object
      required:
        - count
        - products
      properties:
        count:
          type: integer
          minimum: 0
          example: 1
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    InventoryItem:
      type: object
      required:
        - product_id
        - name
        - category
        - stock_quantity
        - status
      properties:
        product_id:
          type: integer
          example: 12
        name:
          type: string
          example: Maize Flour 2kg
        category:
          type: string
          nullable: true
          example: Grains
        stock_quantity:
          type: integer
          minimum: 0
          example: 25
        status:
          type: string
          enum: [out_of_stock, low_stock, in_stock]
          description: out_of_stock is zero units; low_stock is 1-9 units; in_stock is 10 or more units.
          example: in_stock

    InventoryResponse:
      type: object
      required:
        - count
        - inventory
      properties:
        count:
          type: integer
          minimum: 0
          example: 2
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'

    Sale:
      type: object
      required:
        - id
        - product_id
        - product_name
        - sale_date
        - quantity_sold
        - total_price
      properties:
        id:
          type: integer
          description: LiteStock sales.id.
          example: 501
        product_id:
          type: integer
          example: 12
        product_name:
          type: string
          example: Maize Flour 2kg
        sale_date:
          type: string
          format: date-time
          example: '2026-10-28T11:24:00Z'
        quantity_sold:
          type: integer
          minimum: 1
          example: 2
        total_price:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          example: 360.00

    SalesResponse:
      type: object
      required:
        - count
        - sales
      properties:
        count:
          type: integer
          minimum: 0
          example: 1
        sales:
          type: array
          items:
            $ref: '#/components/schemas/Sale'

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Invalid product_id
